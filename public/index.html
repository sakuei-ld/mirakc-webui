<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mirakc-webui</title>
<style>
:root {
  --bg: #0f1117;
  --bg-card: #1a1d27;
  --bg-hover: #252836;
  --border: #2a2d3a;
  --text: #e4e6f0;
  --text-dim: #8b8fa3;
  --accent: #6c8cff;
  --accent-hover: #8aa4ff;
  --red: #ff5c5c;
  --orange: #ffb347;
  --green: #4ec993;
  --radius: 8px;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
/* Header */
.header {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 12px;
}
.controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.search-box {
  flex: 1;
  min-width: 200px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.search-box:focus { border-color: var(--accent); }
.search-box::placeholder { color: var(--text-dim); }
.tab-btn, .sort-btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text-dim);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.tab-btn:hover, .sort-btn:hover { border-color: var(--accent); color: var(--text); }
.tab-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
/* Schedule tab controls */
.schedule-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.date-nav {
  display: flex;
  align-items: center;
  gap: 4px;
}
.date-nav button {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
}
.date-nav button:hover { border-color: var(--accent); }
.date-nav .date-label {
  font-size: 14px;
  font-weight: 600;
  min-width: 100px;
  text-align: center;
}
.channel-filter {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.channel-filter:focus { border-color: var(--accent); }
/* Program grid (guide view) */
.program-grid-container {
  overflow-x: auto;
  padding: 0 24px 24px;
}
/* Guide mode: container fills available height */
.grid.guide-view .program-grid-container {
  flex: 1;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0;
  display: flex;
  flex-direction: column;
}
.grid.guide-view .program-grid {
  flex: 1;
  overflow-y: auto;
}
.program-grid {
  display: grid;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.program-grid .time-col {
  background: var(--bg-card);
  padding: 8px;
  font-size: 12px;
  color: var(--text-dim);
  text-align: right;
  position: sticky;
  left: 0;
  z-index: 10;
}
.program-grid .channel-header {
  background: var(--bg-card);
  padding: 10px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  position: sticky;
  top: 0;
  z-index: 20;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.program-grid .program-cell {
  background: var(--bg-card);
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-left: 2px solid transparent;
}
.program-grid .program-cell:hover {
  background: var(--bg-hover);
  border-left-color: var(--accent);
}
.program-grid .program-cell.recording {
  background: rgba(78,201,147,0.1);
  border-left-color: var(--green);
}
.program-grid .program-cell.reserved {
  background: rgba(108,140,255,0.1);
  border-left-color: var(--accent);
}
.program-grid .program-cell .prog-name {
  font-weight: 500;
  margin-bottom: 2px;
}
.program-grid .program-cell .prog-time {
  font-size: 11px;
  color: var(--text-dim);
}
.program-grid .program-cell .prog-badge {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 600;
  margin-left: 4px;
}
.program-grid .program-cell .prog-badge.paid {
  background: rgba(255,179,71,0.2);
  color: var(--orange);
}
/* Schedule list */
.schedule-list {
  padding: 0 24px 24px;
}
.schedule-date-group {
  margin-bottom: 16px;
}
.schedule-date-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.schedule-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 6px;
  transition: border-color 0.15s;
}
.schedule-item:hover { border-color: var(--accent); }
.schedule-time {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  min-width: 90px;
}
.schedule-info {
  flex: 1;
  min-width: 0;
}
.schedule-program-name {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.schedule-channel-name {
  font-size: 12px;
  color: var(--text-dim);
}
.schedule-cancel-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.schedule-cancel-btn:hover { border-color: var(--red); color: var(--red); }
/* Manual reservation form */
.reservation-form {
  padding: 0 24px 24px;
}
.reservation-form form {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.reservation-form label {
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.reservation-form input,
.reservation-form select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.reservation-form input:focus,
.reservation-form select:focus { border-color: var(--accent); }
.reservation-form .form-actions {
  grid-column: 1 / -1;
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 8px;
}
.reservation-form .form-actions .btn {
  min-width: 80px;
  text-align: center;
}
.sort-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.count-badge {
  color: var(--text-dim);
  font-size: 13px;
  margin-left: auto;
}
/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
  padding: 24px;
}
/* Guide mode: fill remaining viewport */
.grid.guide-view {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 80px);
  overflow: hidden;
  padding: 0;
  gap: 0;
}
.grid.guide-view .program-grid-container {
  flex: 1;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.grid.guide-view .program-grid {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

/* Card */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform 0.15s, box-shadow 0.15s;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.card-thumb {
  width: 100%;
  height: 180px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  cursor: pointer;
}
.card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card-thumb .placeholder {
  color: var(--text-dim);
  font-size: 13px;
}
.card-thumb .drop-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
}
.drop-badge.ok { background: rgba(78,201,147,0.15); color: var(--green); }
.drop-badge.warn { background: rgba(255,179,71,0.15); color: var(--orange); }
.drop-badge.bad { background: rgba(255,92,92,0.15); color: var(--red); }
.card-body { padding: 14px; }
.card-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-channel {
  font-size: 12px;
  color: var(--accent);
  margin-bottom: 8px;
}
.card-meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 10px;
}
.card-meta span { white-space: nowrap; }
.card-meta .drops { color: var(--orange); }
.card-meta .size { color: var(--text-dim); }
.card-actions {
  display: flex;
  gap: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.card-btn {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.card-btn:hover { border-color: var(--accent); background: var(--bg-hover); }
.card-btn.download:hover { border-color: var(--accent); color: var(--accent); }
.card-btn.delete:hover { border-color: var(--red); color: var(--red); }
.card-btn.restore:hover { border-color: var(--green); color: var(--green); }
.card-btn.permanent:hover { border-color: var(--red); color: var(--red); }
/* Trash card specific */
.card.trash-card {
  border-left: 3px solid var(--orange);
}
.card.trash-card .card-thumb {
  opacity: 0.85;
}
/* Detail Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 90%;
  max-width: 700px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px;
  position: relative;
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px;
  height: 32px;
  border: none;
  background: var(--bg);
  color: var(--text-dim);
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.2s;
}
.modal-close:hover { color: var(--text); }
.modal-thumb {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  border-radius: var(--radius);
  margin-bottom: 16px;
  background: var(--bg);
}
.modal-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 4px;
}
.modal-channel {
  color: var(--accent);
  font-size: 14px;
  margin-bottom: 16px;
}
.modal-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.stat-box {
  background: var(--bg);
  border-radius: var(--radius);
  padding: 12px;
  text-align: center;
}
.stat-box .label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.stat-box .value { font-size: 18px; font-weight: 700; }
.stat-box .value.green { color: var(--green); }
.stat-box .value.orange { color: var(--orange); }
.stat-box .value.red { color: var(--red); }
.stat-box .value.accent { color: var(--accent); }
.modal-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.btn {
  padding: 10px 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover { border-color: var(--accent); background: var(--bg-hover); }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn.primary:hover { background: var(--accent-hover); }
.btn.danger {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.btn.danger:hover { background: #ff7a7a; }
.btn.success {
  background: var(--green);
  border-color: var(--green);
  color: #fff;
}
.btn.success:hover { background: #6dd9a8; }
/* Confirm Modal */
.confirm-modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 90%;
  max-width: 420px;
  padding: 24px;
  position: relative;
}
.confirm-modal h3 {
  margin-bottom: 12px;
  font-size: 16px;
}
.confirm-modal p {
  font-size: 14px;
  color: var(--text-dim);
  margin-bottom: 16px;
  line-height: 1.5;
}
.confirm-modal .filename {
  font-size: 12px;
  word-break: break-all;
  background: var(--bg);
  padding: 8px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  color: var(--text);
}
.confirm-modal .actions {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
}
/* Loading */
.loading {
  text-align: center;
  padding: 60px;
  color: var(--text-dim);
  font-size: 14px;
}
.loading .spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* Responsive */
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; padding: 12px; }
  .controls { flex-direction: column; }
  .search-box { min-width: 100%; }
  .modal { width: 95%; padding: 16px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>📺 mirakc-webui</h1>
  <div class="controls">
    <button class="tab-btn active" data-tab="recorded">📁 録画一覧</button>
    <button class="tab-btn" data-tab="guide">📺 番組表</button>
    <button class="tab-btn" data-tab="schedules">📅 予約一覧</button>
    <button class="tab-btn" data-tab="manual-reserve">⏰ 予約</button>
    <button class="tab-btn" data-tab="trash">🗑 ゴミ箱</button>
    <input type="text" class="search-box" id="searchBox" placeholder="番組名・チャンネルで検索...">
    <button class="sort-btn active" data-sort="">最新順</button>
    <button class="sort-btn" data-sort="drops">ドロップ順</button>
    <button class="sort-btn" data-sort="size">サイズ順</button>
    <span class="count-badge" id="countBadge">読み込み中...</span>
  </div>
</div>

<div class="grid" id="grid">
  <div class="loading">
    <div class="spinner"></div>
    <div>ファイル一覧を読み込み中...</div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="confirm-modal" id="confirmModal">
    <h3 id="confirmTitle">確認</h3>
    <p id="confirmMessage"></p>
    <div class="filename" id="confirmFilename"></div>
    <div class="actions" id="confirmActions"></div>
  </div>
</div>

<script>
const API = '/api/recorded';
const TRASH_API = '/api/trash';
let allFiles = [];
let trashFiles = [];
let currentTab = 'recorded';
let currentSort = '';
let currentSearch = '';
let confirmCallback = null;

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    currentSort = '';
    currentSearch = '';
    document.getElementById('searchBox').value = '';
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.sort-btn[data-sort=""]').classList.add('active');
    loadData();
  });
});

// Fetch files
async function fetchFiles() {
  const params = new URLSearchParams();
  if (currentSearch) params.set('q', currentSearch);
  if (currentSort) params.set('sort', currentSort);
  const url = `${API}?${params.toString()}`;
  try {
    const res = await fetch(url);
    allFiles = await res.json();
  } catch (e) {
    console.error('Failed to fetch files:', e);
    allFiles = [];
  }
}

async function fetchTrashFiles() {
  try {
    const res = await fetch(TRASH_API);
    trashFiles = await res.json();
  } catch (e) {
    console.error('Failed to fetch trash:', e);
    trashFiles = [];
  }
}

async function loadData() {
  if (currentTab === 'recorded') {
    await fetchFiles();
    renderGrid(allFiles, false);
  } else {
    await fetchTrashFiles();
    renderGrid(trashFiles, true);
  }
}

// Render grid
function renderGrid(files, isTrash) {
  const grid = document.getElementById('grid');
  document.getElementById('countBadge').textContent = `${files.length}件`;

  if (files.length === 0) {
    grid.innerHTML = `<div class="loading"><div>${isTrash ? 'ゴミ箱は空です' : '録画ファイルが見つかりません'}</div></div>`;
    return;
  }

  grid.innerHTML = files.map(f => {
    const dropClass = f.drop_count === 0 ? 'ok' : f.drop_count < 10 ? 'warn' : 'bad';
    const thumbHtml = f.thumbnail_url
      ? `<img src="${f.thumbnail_url}" alt="${f.filename}" loading="lazy">`
      : `<div class="placeholder">サムネイルなし</div>`;
    
    let actionsHtml = '';
    if (isTrash) {
      const expired = f.days_remaining === 0;
      const expiryText = expired ? '⚠️ 削除予定' : `残り ${f.days_remaining}日`;
      actionsHtml = `
        <button class="card-btn restore" onclick="showRestoreConfirm('${f.id}', '${escHtml(f.filename)}')">↩ 復元</button>
        <button class="card-btn permanent" onclick="showPermanentDeleteConfirm('${f.id}', '${escHtml(f.filename)}')">✕ 削除</button>
      `;
    } else {
      actionsHtml = `
        <a class="card-btn download" href="/api/recorded/${f.id}/download" download>⬇ ダウンロード</a>
        <button class="card-btn delete" onclick="showDeleteConfirm('${f.id}', '${escHtml(f.filename)}')">🗑 削除</button>
      `;
    }

    return `
      <div class="card ${isTrash ? 'trash-card' : ''}">
        <div class="card-thumb" onclick="showDetail('${f.id}', ${isTrash})">
          ${thumbHtml}
          <span class="drop-badge ${dropClass}">
            ${f.drop_count} drops
          </span>
          ${isTrash ? `<span class="drop-badge" style="left:8px;right:auto;background:rgba(255,179,71,0.15);color:var(--orange)">${expiryText}</span>` : ''}
        </div>
        <div class="card-body">
          <div class="card-title">${escHtml(f.program_name)}</div>
          <div class="card-channel">${escHtml(f.channel_name)}</div>
          <div class="card-meta">
            <span class="time">⏱ ${f.recording_time}</span>
            <span class="drops">${f.drop_count} drops (${f.drop_percentage.toFixed(2)}%)</span>
            <span class="size">💾 ${f.filesize_mb.toFixed(0)}MB</span>
          </div>
          <div class="card-actions">
            ${actionsHtml}
          </div>
        </div>
      </div>`;
  }).join('');
}

// Show detail modal
async function showDetail(id, isTrash) {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  overlay.classList.add('open');
  content.innerHTML = '<div class="loading"><div class="spinner"></div><div>詳細読み込み中...</div></div>';

  try {
    const api = isTrash ? TRASH_API : API;
    const res = await fetch(`${api}/${id}`);
    const f = await res.json();

    const dropClass = f.drop_count === 0 ? 'green' : f.drop_count < 10 ? 'orange' : 'red';
    const thumbHtml = f.thumbnail_url
      ? `<img class="modal-thumb" src="${f.thumbnail_url}" alt="${f.filename}">`
      : '';

    let actionsHtml = '';
    if (isTrash) {
      actionsHtml = `
        <button class="btn success" onclick="restoreFile('${f.id}', '${escHtml(f.filename)}')">↩ 復元</button>
        <button class="btn danger" onclick="confirmPermanentDelete('${f.id}', '${escHtml(f.filename)}')">✕ 永久削除</button>
        <button class="btn" onclick="closeModal()">閉じる</button>
      `;
    } else {
      actionsHtml = `
        <a class="btn primary" href="/api/recorded/${f.id}/download" download>⬇ ダウンロード</a>
        <button class="btn danger" onclick="showDeleteConfirm('${f.id}', '${escHtml(f.filename)}')">🗑 削除</button>
        <button class="btn" onclick="closeModal()">閉じる</button>
      `;
    }

    content.innerHTML = `
      ${thumbHtml}
      <div class="modal-title">${escHtml(f.program_name)}</div>
      <div class="modal-channel">${escHtml(f.channel_name)}</div>
      <div class="modal-stats">
        <div class="stat-box">
          <div class="label">録画時間</div>
          <div class="value accent">${f.recording_time}</div>
        </div>
        <div class="stat-box">
          <div class="label">ファイルサイズ</div>
          <div class="value accent">${f.filesize_mb.toFixed(0)} MB</div>
        </div>
        <div class="stat-box">
          <div class="label">ドロップ数</div>
          <div class="value ${dropClass}">${f.drop_count}</div>
        </div>
        <div class="stat-box">
          <div class="label">ドロップ率</div>
          <div class="value ${dropClass}">${f.drop_percentage.toFixed(2)}%</div>
        </div>
        <div class="stat-box">
          <div class="label">エラー数</div>
          <div class="value ${f.error_count > 0 ? 'red' : 'green'}">${f.error_count}</div>
        </div>
        <div class="stat-box">
          <div class="label">総パケット数</div>
          <div class="value">${f.total_packets.toLocaleString()}</div>
        </div>
      </div>
      <h3 style="margin-bottom:8px;font-size:14px;color:var(--text-dim)">ファイル名</h3>
      <div style="font-size:13px;word-break:break-all;margin-bottom:16px;color:var(--text)">${escHtml(f.filename)}</div>
      ${isTrash ? `<div style="font-size:13px;color:var(--text-dim);margin-bottom:16px">📅 削除予定: ${f.days_remaining}日後</div>` : ''}
      <div class="modal-actions">
        ${actionsHtml}
      </div>`;
  } catch (e) {
    content.innerHTML = `<div class="loading"><div>エラー: ${e.message}</div></div>`;
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

// Delete confirm (move to trash)
function showDeleteConfirm(id, filename) {
  showConfirm(
    '🗑️ ゴミ箱に移動',
    'このファイルをゴミ箱に移動しますか？<br>ゴミ箱からは復元できます。',
    filename,
    () => doDelete(id, filename)
  );
}

async function doDelete(id, filename) {
  try {
    const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
    if (res.ok) {
      closeConfirm();
      await loadData();
    } else {
      alert('削除に失敗しました');
    }
  } catch (e) {
    alert('エラー: ' + e.message);
  }
}

// Restore
function showRestoreConfirm(id, filename) {
  showConfirm(
    '↩ 復元',
    'このファイルを元の場所に復元しますか？',
    filename,
    () => restoreFile(id, filename)
  );
}

async function restoreFile(id, filename) {

      closeConfirm();
      await loadData();
    } else {
      alert('復元に失敗しました');
    }
  } catch (e) {
    alert('エラー: ' + e.message);
  }
}

// Permanent delete

    if (res.ok) {
      closeConfirm();
      await loadData();
    } else {

// Confirm modal
function showConfirm(title, message, filename, callback) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMessage').innerHTML = message;
  document.getElementById('confirmFilename').textContent = filename;
  confirmCallback = callback;
  
  const actions = document.getElementById('confirmActions');
  actions.innerHTML = `
    <button class="btn" id="confirmCancel">キャンセル</button>
    <button class="btn danger" id="confirmOk">確認</button>
  `;
  
  document.getElementById('confirmCancel').addEventListener('click', closeConfirm);
  document.getElementById('confirmOk').addEventListener('click', () => {
    if (confirmCallback) confirmCallback();
  });
  
  document.getElementById('confirmOverlay').classList.add('open');
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('open');
  confirmCallback = null;
}

// Escaping
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── Schedule data (mirakc 3.x types) ──
let programs = [];
let services = [];
let schedules = [];
let guideDate = new Date();
let guideChannelFilter = '';

async function loadData() {
  const grid = document.getElementById('grid');
  // Toggle guide-view class for full-viewport layout
  grid.classList.toggle('guide-view', currentTab === 'guide');
  switch (currentTab) {
    case 'recorded':
      await fetchFiles();
      renderGrid(allFiles, false);
      break;
    case 'trash':
      await fetchTrashFiles();
      renderGrid(trashFiles, true);
      break;
    case 'guide':
      await Promise.all([fetchPrograms(), fetchServices()]);
      renderProgramGuide();
      break;
    case 'schedules':
      await fetchSchedules();
      renderScheduleList();
      break;
    case 'manual-reserve':
      await fetchServices();
      renderManualReserveForm();
      break;
  }
}

// ── Programs API ──
async function fetchPrograms() {
  const startOfDay = new Date(guideDate);
  startOfDay.setHours(0, 0, 0, 0);
  const endOfDay = new Date(guideDate);
  endOfDay.setHours(23, 59, 59, 999);
  
  const params = new URLSearchParams();
  params.set('start_at', Math.floor(startOfDay.getTime() / 1000));
  params.set('end_at', Math.floor(endOfDay.getTime() / 1000));
  
  try {
    const res = await fetch(`/api/programs?${params.toString()}`);
    programs = await res.json();
  } catch (e) {
    console.error('Failed to fetch programs:', e);
    programs = [];
  }
}

async function fetchServices() {
  try {
    const res = await fetch('/api/services');
    const allServices = await res.json();
    // mirakc 3.x: deduplicate by unique id (u64), not service_id (u16)
    // Because BS services have different id but same service_id
    const seen = new Set();
    services = allServices.filter(s => {
      if (seen.has(s.id)) return false;
      seen.add(s.id);
      return true;
    });
  } catch (e) {
    console.error('Failed to fetch services:', e);
    services = [];
  }
}

async function fetchSchedules() {
  try {
    const res = await fetch('/api/schedules');
    schedules = await res.json();
  } catch (e) {
    console.error('Failed to fetch schedules:', e);
    schedules = [];
  }
}

// ── Program Guide ──
function renderProgramGuide() {
  const grid = document.getElementById('grid');
  document.getElementById('countBadge').textContent = `${programs.length}番組 (${services.length}ch)`;
  
  console.log('renderProgramGuide: programs=', programs.length, 'services=', services.length);
  if (programs.length > 0) {
    console.log('  first program:', programs[0]);
  }
  
  if (services.length === 0) {
    grid.innerHTML = '<div class="loading"><div>サービス情報を読み込めません</div></div>';
    return;
  }
  
  // Filter by date
  const startOfDay = new Date(guideDate);
  startOfDay.setHours(0, 0, 0, 0);
  const endOfDay = new Date(guideDate);
  endOfDay.setHours(23, 59, 59, 999);
  
  // mirakc 3.x returns start_at in SECONDS, convert to ms for comparison
  const dayMsStart = Math.floor(startOfDay.getTime() / 1000);
  const dayMsEnd = Math.floor(endOfDay.getTime() / 1000);
  const dayPrograms = programs.filter(p => {
    if (!p.start_at) return false;
    return p.start_at >= dayMsStart && p.start_at <= dayMsEnd;
  });
  console.log('dayPrograms:', dayPrograms.length);
  
  // Filter by channel
  let filteredPrograms = dayPrograms;
  let displayServices = services;
  if (guideChannelFilter) {
    const filterServiceId = parseInt(guideChannelFilter);
    filteredPrograms = dayPrograms.filter(p => p.service_id === filterServiceId);
    displayServices = services.filter(s => s.service_id === filterServiceId);
  }
  
  // Build grid: 1440 rows (one per minute), with hour markers every 60 rows
  const ROWS_PER_HOUR = 60;
  const COL_WIDTH = 200; // px per channel column
  
  // Precompute hour labels
  const hourLabels = [];
  for (let h = 0; h < 24; h++) {
    hourLabels.push({ hour: h, label: `${h.toString().padStart(2, '0')}:00` });
  }
  
  // Build program lookup: for each service, create a map of minute -> program
  const serviceProgramMap = {};
  displayServices.forEach(service => {
    const serviceId = service.id;
    serviceProgramMap[serviceId] = {};
    filteredPrograms
      .filter(p => p.service_id === service.service_id && p.start_at)
      .forEach(prog => {
        const start = new Date(prog.start_at * 1000);
        const startMinute = start.getHours() * 60 + start.getMinutes();
        const durationMin = Math.ceil((prog.duration || 0) / 60000);
        const endMinute = startMinute + durationMin;
        
        for (let m = startMinute; m < endMinute; m++) {
          if (!serviceProgramMap[serviceId][m]) {
            serviceProgramMap[serviceId][m] = [];
          }
          serviceProgramMap[serviceId][m].push({ prog, startMinute, endMinute });
        }
      });
  });
  
  // Calculate responsive column widths
  const gridContainer = document.querySelector('.program-grid-container');
  const containerWidth = gridContainer ? gridContainer.clientWidth : window.innerWidth - 48;
  const timeColWidth = 60;
  const availableWidth = containerWidth - timeColWidth;
  const serviceColWidth = Math.max(120, Math.floor(availableWidth / displayServices.length));
  
  // Set grid dimensions to fill viewport
  const headerHeight = 40;
  const rowHeight = 2;
  const totalHeight = 1440 * rowHeight;
  const gridMaxHeight = window.innerHeight - 140; // account for header + padding
  const gridHeight = Math.min(totalHeight, gridMaxHeight);
  
  const colDef = `${timeColWidth}px ${Array(displayServices.length).fill(`${serviceColWidth}px`).join(' ')}`;
  console.log('displayServices:', displayServices.length, displayServices.map(s => s.name));
  let html = `<div class="program-grid-container" style="padding-bottom:0"><div class="program-grid" style="grid-template-rows: ${headerHeight}px repeat(1440, ${rowHeight}px); grid-template-columns: ${colDef};">`;
  
  // Header row (row 1)
  html += '<div class="time-col" style="position:sticky;left:0;z-index:20;background:var(--bg-card)">時間</div>';
  displayServices.forEach(s => {
    html += `<div class="channel-header" style="position:sticky;top:0;z-index:20;background:var(--bg-card)">${escHtml(s.name)}</div>`;
  });
  
  // Build all 1440 rows (minute by minute)
  // Row 1 = header, so minute 0 = row 2, hour 00:00 = row 62
  const HEADER_OFFSET = 1; // row 1 is header
  
  for (let minute = 0; minute < 1440; minute++) {
    const row = minute + 1 + HEADER_OFFSET;
    const h = Math.floor(minute / 60);
    const isHourStart = minute % 60 === 0;
    
    // Time column cell
    if (isHourStart) {
      html += `<div class="time-col" style="grid-row:${row};grid-column:1;position:sticky;left:0;z-index:10;background:var(--bg-card)">${h.toString().padStart(2, '0')}:00</div>`;
    } else {
      html += `<div class="time-col" style="grid-row:${row};grid-column:1;background:var(--bg-card)"></div>`;
    }
    
    // Program cells for each service
    displayServices.forEach(service => {
      const serviceId = service.id;
      const progs = serviceProgramMap[serviceId]?.[minute];
      
      if (progs && progs.length > 0) {
        const { prog, startMinute, endMinute } = progs[0];
        const isReserved = schedules.some(s => s.program.id === prog.id);
        const classes = ['program-cell'];
        if (isReserved) classes.push('reserved');
        
        const paidBadge = !prog.is_free ? '<span class="prog-badge paid">有料</span>' : '';
        const start = new Date(prog.start_at * 1000);
        const durationMs = prog.duration || 0;
        const end = new Date(start.getTime() + durationMs);
        const timeStr = `${start.getHours().toString().padStart(2, '0')}:${start.getMinutes().toString().padStart(2, '0')}〜${end.getHours().toString().padStart(2, '0')}:${end.getMinutes().toString().padStart(2, '0')}`;
        
        const rowSpan = endMinute - startMinute;
        const startRow = startMinute + 1 + HEADER_OFFSET;
        
        html += `<div class="${classes.join(' ')}" style="grid-row:${startRow}/${startRow + rowSpan}" onclick="showProgramDetail(${prog.id})">
          <div class="prog-name">${escHtml(prog.name || '無題')}${paidBadge}</div>
          <div class="prog-time">${timeStr}</div>
        </div>`;
      } else {
        html += `<div class="program-cell" style="grid-row:${row};opacity:0.3"></div>`;
      }
    });
  }
  
  html += '</div></div>';
  grid.innerHTML = html;
}

function showProgramDetail(programId) {
  const prog = programs.find(p => p.id === Number(programId));
  if (!prog) return;
  
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  overlay.classList.add('open');
  
  const service = services.find(s => s.service_id === prog.service_id);
  const isReserved = schedules.some(s => s.program.id === prog.id);
  
  const start = new Date(prog.start_at * 1000);
  const durationMs = prog.duration || 0;
  const end = new Date(start.getTime() + durationMs);
  const timeStr = `${start.toLocaleDateString()} ${start.getHours().toString().padStart(2, '0')}:${start.getMinutes().toString().padStart(2, '0')}〜${end.getHours().toString().padStart(2, '0')}:${end.getMinutes().toString().padStart(2, '0')}`;
  
  content.innerHTML = `
    <div class="modal-title">${escHtml(prog.name || '無題')}</div>
    <div class="modal-channel">${service ? escHtml(service.name) : '不明'}</div>
    <div class="modal-stats">
      <div class="stat-box">
        <div class="label">時間</div>
        <div class="value accent">${timeStr}</div>
      </div>
      <div class="stat-box">
        <div class="label">種別</div>
        <div class="value">${!prog.is_free ? '有料' : '無料'}</div>
      </div>
      <div class="stat-box">
        <div class="label">予約</div>
        <div class="value ${isReserved ? 'green' : 'orange'}">${isReserved ? '予約済み' : '未予約'}</div>
      </div>
    </div>
    ${prog.description ? `<div style="font-size:13px;color:var(--text-dim);margin-bottom:16px;line-height:1.5">${escHtml(prog.description)}</div>` : ''}
    <div class="modal-actions">
      ${isReserved ? `<button class="btn danger" onclick="cancelSchedule(${prog.id})">予約取消</button>` : `<button class="btn primary" onclick="reserveProgram(${prog.id})">録画予約</button>`}
      <button class="btn" onclick="closeModal()">閉じる</button>
    </div>
  `;
}

async function reserveProgram(programId) {
  const prog = programs.find(p => p.id === Number(programId));
  if (!prog) return;
  
  const service = services.find(s => s.service_id === prog.service_id);
  if (!service) {
    alert('サービス情報が見つかりません');
    return;
  }
  
  // mirakc 3.x: WebRecordingScheduleInput = { program_id, options, tags }
  const input = {
    program_id: prog.id,
    options: {},
    tags: []
  };
  
  try {
    const res = await fetch('/api/schedules', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(input)
    });
    
    if (res.ok) {
      await fetchSchedules();
      renderProgramGuide();
      closeModal();
      alert('予約しました');
    } else {
      alert('予約に失敗しました');
    }
  } catch (e) {
    alert('エラー: ' + e.message);
  }
}

async function cancelSchedule(programId) {
  showConfirm(
    '予約取消',
    'この予約を取消しますか？',
    `Program ID: ${programId}`,
    async () => {
      try {
        const res = await fetch(`/api/schedules/${programId}`, { method: 'DELETE' });
        if (res.ok) {
          await fetchSchedules();
          renderProgramGuide();
          closeConfirm();
          alert('予約を取消しました');
        } else {
          alert('取消に失敗しました');
        }
      } catch (e) {
        alert('エラー: ' + e.message);
      }
    }
  );
}

// ── Schedule List (mirakc 3.x: schedule has nested program) ──
function renderScheduleList() {
  const grid = document.getElementById('grid');
  document.getElementById('countBadge').textContent = `${schedules.length}件`;
  
  if (schedules.length === 0) {
    grid.innerHTML = '<div class="loading"><div>予約一覧は空です</div></div>';
    return;
  }
  
  // Group by date
  const groups = {};
  schedules.forEach(s => {
    const date = new Date(s.program.start_at * 1000);
    const dateKey = date.toLocaleDateString();
    if (!groups[dateKey]) groups[dateKey] = [];
    groups[dateKey].push(s);
  });
  
  // Sort each group by start time
  Object.values(groups).forEach(arr => arr.sort((a, b) => a.program.start_at - b.program.start_at));
  
  let html = '<div class="schedule-list">';
  Object.entries(groups).forEach(([dateKey, items]) => {
    html += `<div class="schedule-date-group">`;
    html += `<div class="schedule-date-label">${dateKey}</div>`;
    
    items.forEach(s => {
      const start = new Date(s.program.start_at * 1000);
      const durationMs = s.program.duration || 0;
      const end = new Date(start.getTime() + durationMs);
      const timeStr = `${start.getHours().toString().padStart(2, '0')}:${start.getMinutes().toString().padStart(2, '0')}〜${end.getHours().toString().padStart(2, '0')}:${end.getMinutes().toString().padStart(2, '0')}`;
      
      const service = services.find(sv => sv.service_id === s.program.service_id);
      
      html += `<div class="schedule-item">
        <div class="schedule-time">${timeStr}</div>
        <div class="schedule-info">
          <div class="schedule-program-name">${escHtml(s.program.name || '無題')}</div>
          <div class="schedule-channel-name">${escHtml(service ? service.name : '不明')}</div>
        </div>
        <button class="schedule-cancel-btn" onclick="cancelSchedule(${s.program.id})">取消</button>
      </div>`;
    });
    
    html += `</div>`;
  });
  
  html += '</div>';
  grid.innerHTML = html;
}

// ── Manual Reservation ──
function renderManualReserveForm() {
  const grid = document.getElementById('grid');
  
  let serviceOptions = '<option value="">サービスを選択...</option>';
  services.forEach(s => {
    serviceOptions += `<option value="${s.id}">${escHtml(s.name)}</option>`;
  });
  
  grid.innerHTML = `
    <div class="reservation-form">
      <form id="manualReserveForm" onsubmit="submitManualReserve(event)">
        <div>
          <label>日付</label>
          <input type="date" id="reserveDate" required>
        </div>
        <div>
          <label>サービス</label>
          <select id="reserveService" required>${serviceOptions}</select>
        </div>
        <div>
          <label>開始時刻</label>
          <input type="time" id="reserveStart" required>
        </div>
        <div>
          <label>終了時刻</label>
          <input type="time" id="reserveEnd" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn primary">予約</button>
          <button type="reset" class="btn">リセット</button>
        </div>
      </form>
    </div>
  `;
  
  // Set default date to today
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('reserveDate').value = today;
}

async function submitManualReserve(event) {
  event.preventDefault();
  
  const dateStr = document.getElementById('reserveDate').value;
  const serviceId = parseInt(document.getElementById('reserveService').value);
  const [startH, startM] = document.getElementById('reserveStart').value.split(':').map(Number);
  const [endH, endM] = document.getElementById('reserveEnd').value.split(':').map(Number);
  
  if (!serviceId) {
    alert('サービスを選択してください');
    return;
  }
  
  const start = new Date(dateStr);
  start.setHours(startH, startM, 0, 0);
  const end = new Date(dateStr);
  end.setHours(endH, endM, 0, 0);
  
  if (end <= start) {
    alert('終了時刻は開始時刻より後にしてください');
    return;
  }
  
  const service = services.find(s => s.id === serviceId);
  if (!service) {
    alert('サービス情報が見つかりません');
    return;
  }
  
  // mirakc 3.x: program_id is required, use a placeholder
  const input = {
    program_id: 0,
    options: {},
    tags: []
  };
  
  try {
    const res = await fetch('/api/schedules', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(input)
    });
    
    if (res.ok) {
      await fetchSchedules();
      renderManualReserveForm();
      alert('予約しました');
    } else {
      const text = await res.text();
      alert(`予約に失敗しました: ${text}`);
    }
  } catch (e) {
    alert('エラー: ' + e.message);
  }
}

// Init
loadData();
</script>
</body>
